# Curated sources Pehredaar watches. Synced into the database at startup:
# new entries are added, edited entries updated (polling state is kept), and
# entries removed from this file are disabled, not deleted.
#
# Placeholders in url:
#   {lang}  english / hindi, one source per entry in `languages`
#   {year}  the current year (the calendar needs it; on 1 January the URL
#           changes, so the old year's source is disabled and a new one starts)
#
# Web pages (the page reader; docs/ARCHITECTURE.md §8). CSS selectors:
#   kind: feed + format: html   a notice list; needs `items` (one element
#                               per notice), optional `title`, `date`
#                               (needed if windowed) and `key` (link|title)
#   kind: html                  a plain page, diffed line by line
#   content: <sel>              read only this part (default body)
#   drop: [<sel>, ...]          remove these first (tickers, "new" badges)
# Try them first: pehredaar probe -content ... -items ... -title ... <url>
#
# The query strings are exactly what ssc.gov.in's own front end sends
# (verified with `pehredaar probe`, 2026-11-01). Don't hand-edit them
# without probing first.

# How often PDFs discovered in feeds are re-checked.
discovered_interval: 6h
# After this long a discovered PDF is retired (no longer checked). Notices
# rarely change months after they're published, and without a limit the
# watch set would only ever grow.
discovered_retire_after: 120d

sources:
  - label: SSC Notice Board
    kind: feed
    category: ssc:notice-board
    languages: [en, hi]
    url: https://ssc.gov.in/api/general-website/portal/notice-boards?page=1&limit=10&contentType=notice-boards&key=createdAt&order=DESC&isAttachment=true&language={lang}&attributes=id,headline,examId,contentType,redirectUrl,startDate,endDate,language,createdAt
    interval: 15m
    windowed: true
    discover_attachments: true

  - label: SSC Calendar
    kind: feed
    category: ssc:calendar
    languages: [en] # Hindi feed is empty (totalRecords 0, checked 2026-11-02)
    url: https://ssc.gov.in/api/general-website/portal/ssc-calendar?page=1&limit=10&contentType=ssc-calendar&key=startDate&order=ASC&isAttachment=true&isPaginationRequired=false&language={lang}&year={year}&attributes=id,headline,examId,examYear,desc,content,contentType,startDate,endDate,language,createdAt
    interval: 1h
    windowed: false # returns the whole year: a missing item is a removal
    discover_attachments: true

  - label: SSC Admit Cards
    kind: feed
    category: ssc:admit-card
    languages: [en] # Hindi feed is empty (totalRecords 0, checked 2026-11-02)
    url: https://ssc.gov.in/api/general-website/portal/records?page=1&limit=10&contentType=admit-card&key=createdAt&order=DESC&isAttachment=true&language={lang}&attributes=id,headline,examId,examYear,contentType,redirectUrl,startDate,endDate,language,createdAt
    interval: 1h # the English feed was stale (2 items from 2024) when checked
    windowed: true
    discover_attachments: true

  - label: SSC Answer Keys
    kind: feed
    category: ssc:answer-key
    languages: [en, hi]
    url: https://ssc.gov.in/api/general-website/portal/records?page=1&limit=10&contentType=answer-key&key=createdAt&order=DESC&isAttachment=true&language={lang}&attributes=id,headline,examId,examYear,contentType,redirectUrl,startDate,endDate,language,createdAt
    interval: 30m
    windowed: true
    discover_attachments: true

  - label: SSC Results
    kind: feed
    category: ssc:results
    languages: [en, hi]
    url: https://ssc.gov.in/api/general-website/portal/records?page=1&limit=10&contentType=results&key=createdAt&order=DESC&pageType=filter&isAttachment=true&language={lang}&attributes=id,headline,examId,examYear,contentType,redirectUrl,startDate,endDate,language,createdAt
    interval: 30m
    windowed: true
    discover_attachments: true

  - label: SSC Tentative Vacancies
    kind: feed
    category: ssc:tentative-vacancy
    languages: [en] # Hindi feed is empty (totalRecords 0, checked 2026-11-02)
    url: https://ssc.gov.in/api/general-website/portal/records?page=1&limit=10&contentType=tentative-vacancy&key=createdAt&order=DESC&pageType=filter&isAttachment=true&language={lang}&attributes=id,headline,examId,examYear,contentType,redirectUrl,startDate,endDate,language,createdAt
    interval: 1h
    windowed: true
    discover_attachments: true

# --- Web pages, read by the page reader (checked 2026-11-18) ---------------
#
# NTA: jeemain.nta.nic.in and neet.nta.nic.in answer 403 to Pehredaar, so
# JEE and NEET come from the "Latest @ NTA" box on nta.ac.in, which lists
# every NTA exam (its whole history, ~840 notices). Each source filters it
# by headline and keeps the newest 15. The box shows no dates; the PDF file
# names carry a timestamp (Notice_20261117205801.pdf). Both sources fetch
# the same page: the #fragment only keeps their URLs distinct (it is never
# sent to the server). robots.txt: 404 (no restrictions).

  - label: JEE Main notices (NTA)
    kind: feed
    format: html
    category: jee:nta-notices
    languages: [en]
    url: https://nta.ac.in/#jee-main
    interval: 30m
    windowed: true
    discover_attachments: true
    content: marquee.latestPart
    items: p
    title: content
    link_date: '(?i)Notice_(\d{14})\.pdf'
    include: '\bJEE\b|Joint Entrance Examination'
    exclude: '(?i)NCHM|Hotel Management' # NCHM JEE is the hotel-management exam
    max_items: 15

  - label: NEET UG notices (NTA)
    kind: feed
    format: html
    category: neet:nta-notices
    languages: [en]
    url: https://nta.ac.in/#neet-ug
    interval: 30m
    windowed: true
    discover_attachments: true
    content: marquee.latestPart
    items: p
    title: content
    link_date: '(?i)Notice_(\d{14})\.pdf'
    include: '\bNEET\b|National Eligibility[- ]cum[- ]Entrance'
    max_items: 15

# IBPS: "CRP Updates" lists notices for every Common Recruitment Process
# (PO, SO, Clerk, RRB), newest first, each a link wrapping a date
# ("01 Jul 26") and a headline. robots.txt: 404. The server's TLS is
# flaky at times; failed checks just back off.

  - label: IBPS CRP updates
    kind: feed
    format: html
    category: ibps:crp-updates
    languages: [en]
    url: https://www.ibps.in/index.php/crp-updates/
    interval: 30m
    windowed: true
    discover_attachments: true
    items: 'a:has(.detail-section)'
    title: .detail-second-heading
    date: .detail-first-heading

# CISCE (ICSE / ISC): the notifications archive, page 1 (~17 newest). It
# also lists tenders (RFP, EOI), which aren't for students. robots.txt
# allows all bots except AI crawlers.

  - label: CISCE notifications
    kind: feed
    format: html
    category: cisce:notifications
    languages: [en]
    url: https://cisce.org/notifications-archive/
    interval: 30m
    windowed: true
    discover_attachments: true
    items: .e-loop-item.type-notification
    title: h5
    date: .elementor-icon-list-text
    exclude: '(?i)^RFP\b|\bEOI\b|Expression of Interest|\btender'
